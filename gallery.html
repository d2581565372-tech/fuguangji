<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫猫筹码画廊 · 作品收藏馆</title>
<style>
:root{
  --cream:#f7efe2;
  --wine:#5e1219;
  --gold:#c3a06a;
  --ink-soft:#7c6a5c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Songti SC",serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(195,160,106,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(94,18,25,.08), transparent 60%),
    var(--cream);
  color:var(--wine);
  display:flex;flex-direction:column;
}
.nav{
  display:flex;align-items:center;gap:28px;
  margin:clamp(14px,2.2vh,24px) auto 0;
  padding:11px clamp(16px,1.6vw,24px);
  border-radius:999px;
  background:rgba(250,243,234,.88);
  border:1px solid rgba(195,160,106,.34);
  box-shadow:0 14px 30px -20px rgba(74,32,22,.55);
  backdrop-filter:blur(8px) saturate(1.04);
  animation:fadeDown 1s .1s ease both;
}
.nav a{
  font-weight:500;font-size:.92rem;letter-spacing:.22em;
  color:var(--wine);text-decoration:none;transition:opacity .4s;
}
.nav a:hover{opacity:.7}
.stage{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:0 20px;animation:riseIn 1.1s .3s ease both;
}
.coins{
  display:flex;align-items:center;gap:clamp(18px,3vw,40px);
  margin-bottom:clamp(26px,5vh,52px);
}
.coins img{
  width:clamp(76px,9vw,130px);
  filter:drop-shadow(0 12px 18px rgba(72,30,22,.25));
  animation:bob 3.4s ease-in-out infinite;
}
.coins img:nth-child(2){animation-delay:.4s}
.coins img:nth-child(3){animation-delay:.8s}
h1{
  font-size:clamp(1.9rem,4vw,3rem);font-weight:600;
  letter-spacing:.14em;line-height:1.3;
}
h1::after{
  content:"";display:block;width:114px;height:3px;margin:24px auto 0;
  background:linear-gradient(90deg,var(--gold),rgba(195,160,106,0));
}
p{
  margin-top:clamp(14px,2.2vh,22px);
  font-weight:300;font-size:clamp(1rem,1.4vw,1.2rem);
  letter-spacing:.14em;line-height:1.9;color:var(--ink-soft);
}
.back{
  margin-top:clamp(26px,5vh,44px);
  display:inline-block;padding:12px 30px;border-radius:999px;
  border:1px solid rgba(195,160,106,.55);color:var(--wine);
  text-decoration:none;font-size:.85rem;letter-spacing:.24em;
  background:rgba(251,243,228,.8);transition:all .4s;
}
.back:hover{background:var(--wine);color:#fbf3e4;transform:translateY(-2px)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html">作品收藏馆</a>
  <a href="index.html">返回首页</a>
</header>

<main class="stage">
  <div class="coins" aria-hidden="true">
    <img src="assets/pieces/coin-front.png" alt="" draggable="false">
    <img src="assets/pieces/coin-side.png" alt="" draggable="false">
    <img src="assets/pieces/coin-back.png" alt="" draggable="false">
  </div>
  <h1>猫猫筹码画廊</h1>
  <p>画廊正在筹备中 · 敬请期待</p>
  <a class="back" href="index.html">← 返回首页</a>
</main>

</body>
</html>
