<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品详情 · 作品收藏馆</title>
<style>
:root{
  --cream:#f7efe2;
  --wine:#5e1219;
  --gold:#c3a06a;
  --ink-soft:#7c6a5c;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:"Noto Serif SC","Songti SC",serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(195,160,106,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(94,18,25,.08), transparent 60%),
    var(--cream);
  color:var(--wine);
  display:flex;flex-direction:column;
}
.nav{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;
  margin:clamp(14px,2.2vh,24px) auto 0;
  padding:11px clamp(16px,1.6vw,24px);
  border-radius:999px;
  background:rgba(250,243,234,.88);
  border:1px solid rgba(195,160,106,.34);
  box-shadow:0 14px 30px -20px rgba(74,32,22,.55);
  backdrop-filter:blur(8px) saturate(1.04);
  animation:fadeDown 1s .1s ease both;
}
.nav a{
  font-weight:500;font-size:.9rem;letter-spacing:.2em;
  color:var(--wine);text-decoration:none;transition:opacity .4s;
}
.nav a:hover{opacity:.7}
.nav .gtitle{font-weight:600;letter-spacing:.16em;padding:0 6px}
.stage{
  flex:1;padding:clamp(18px,3vh,36px) clamp(16px,4vw,64px) clamp(30px,5vh,56px);
  animation:riseIn 1.1s .25s ease both;
}
h1{
  text-align:center;font-size:clamp(1.5rem,3vw,2.3rem);font-weight:600;
  letter-spacing:.14em;line-height:1.3;
}
h1::after{
  content:"";display:block;width:96px;height:3px;margin:18px auto 0;
  background:linear-gradient(90deg,var(--gold),rgba(195,160,106,0));
}
/* 组内分页条 */
.pager{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:clamp(14px,2.4vh,26px) 0;
}
.pager button{
  padding:8px 20px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(195,160,106,.55);color:var(--wine);
  background:rgba(251,243,228,.8);font-size:.85rem;letter-spacing:.18em;
  font-family:inherit;transition:all .35s;
}
.pager button:hover:not(:disabled){background:var(--wine);color:#fbf3e4}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pn{font-size:.85rem;letter-spacing:.2em;color:var(--ink-soft)}
.dots{display:flex;gap:7px}
.dots i{
  width:8px;height:8px;border-radius:50%;
  background:rgba(195,160,106,.35);transition:all .3s;
}
.dots i.on{background:var(--wine);transform:scale(1.25)}
/* 作品图 + 旁白文字排版 */
.board{
  max-width:1080px;margin:0 auto;
}
.row{
  display:flex;align-items:flex-start;gap:clamp(16px,2vw,28px);
  margin-bottom:clamp(22px,4vh,38px);
}
.row.rev{flex-direction:row-reverse}
.row .ph{
  display:block;flex:1.55;min-width:0;padding:0;border:0;background:none;
  cursor:zoom-in;text-align:center;
}
.row .ph img{
  width:100%;display:block;border-radius:12px;background:#fff;
  box-shadow:0 0 0 4px #fff, 0 18px 34px -14px rgba(74,32,22,.45);
}
.row .ph .cap{
  margin-top:9px;font-size:.8rem;letter-spacing:.18em;color:var(--ink-soft);
}
.row .txt{
  flex:1;min-width:0;align-self:stretch;
  background:rgba(250,243,234,.92);
  border:1px solid rgba(195,160,106,.34);
  border-radius:14px;padding:clamp(14px,2vw,24px) clamp(16px,2vw,26px);
  box-shadow:0 14px 28px -18px rgba(74,32,22,.4);
}
.row .txt h3{
  font-size:.95rem;font-weight:600;letter-spacing:.16em;line-height:1.7;
  margin-bottom:10px;
}
.row .txt h3::after{
  content:"";display:block;width:44px;height:2px;margin-top:7px;
  background:linear-gradient(90deg,var(--gold),rgba(195,160,106,0));
}
.row .txt p{
  font-family:var(--sans,"Noto Sans SC",sans-serif);
  font-weight:300;font-size:.86rem;letter-spacing:.08em;line-height:2;
  color:var(--ink-soft);margin:0;
}
.row .txt p + p{margin-top:6px}
@media (max-width:820px){
  .row,.row.rev{flex-direction:column}
  .row .txt{width:100%}
}
.lead{
  max-width:760px;margin:clamp(12px,2vh,20px) auto 0;text-align:center;
  font-weight:300;font-size:clamp(.88rem,1.3vw,1rem);
  letter-spacing:.1em;line-height:2.1;color:var(--ink-soft);
}
.footnav{
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  margin-top:clamp(26px,5vh,44px);
}
.footnav a{
  display:inline-block;padding:11px 26px;border-radius:999px;
  border:1px solid rgba(195,160,106,.55);color:var(--wine);
  text-decoration:none;font-size:.85rem;letter-spacing:.22em;
  background:rgba(251,243,228,.8);transition:all .4s;
}
.footnav a:hover{background:var(--wine);color:#fbf3e4;transform:translateY(-2px)}
/* 灯箱 */
#lightbox{
  position:fixed;inset:0;z-index:99;
  display:none;align-items:center;justify-content:center;
  background:rgba(46,20,16,.82);backdrop-filter:blur(3px);
  cursor:zoom-out;
}
#lightbox.on{display:flex;animation:fadeIn .3s ease both}
#lightbox img{
  max-width:92vw;max-height:90vh;border-radius:10px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
  animation:zoomIn .35s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.2s!important}
}
</style>
</head>
<body>

<header class="nav">
  <a href="catalog.html">← 返回作品目录</a>
  <span class="gtitle" id="gt"></span>
  <a href="#" id="lnkPrev">← 上一组</a>
  <a href="#" id="lnkNext">下一组 →</a>
</header>

<main class="stage">
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="pager" id="pager" style="display:none">
    <button id="pPrev" type="button">‹ 上一屏</button>
    <span class="pn" id="pnum"></span>
    <span class="dots" id="dots"></span>
    <button id="pNext" type="button">下一屏 ›</button>
  </div>
  <div class="board" id="board"></div>
  <div class="footnav">
    <a href="catalog.html">← 返回作品目录</a>
  </div>
</main>

<div id="lightbox" aria-hidden="true"><img src="" alt=""></div>

<script>
/* ---------- 17 组作品数据 ----------
   pages: 每个元素是一"屏"；普通作品一屏放全部图，展板按内容切成多屏 */
var WORKS = [
  {t:'作品 01', pages:[[
    ['assets/catalog/w01a.jpg','1 / 3'],['assets/catalog/w01b.jpg','2 / 3'],['assets/catalog/w01c.jpg','3 / 3']
  ]]},
  {t:'作品 02', pages:[[
    ['assets/catalog/w02a.jpg','1 / 3'],['assets/catalog/w02b.jpg','2 / 3'],['assets/catalog/w02c.jpg','3 / 3']
  ]]},
  {t:'作品 03', pages:[[
    ['assets/catalog/w03a.jpg','1 / 5'],['assets/catalog/w03b.jpg','2 / 5'],['assets/catalog/w03c.jpg','3 / 5'],
    ['assets/catalog/w03d.jpg','4 / 5'],['assets/catalog/w03e.jpg','5 / 5']
  ]]},
  {t:'作品 04', pages:[[
    ['assets/catalog/w04a.jpg','1 / 2'],['assets/catalog/w04b.jpg','2 / 2']
  ]]},
  {t:'作品 05', pages:[[
    ['assets/catalog/w05a.jpg','1 / 3'],['assets/catalog/w05b.jpg','2 / 3'],['assets/catalog/w05c.jpg','3 / 3']
  ]]},
  {t:'作品 06', pages:[[
    ['assets/catalog/w06a.jpg','1 / 12'],['assets/catalog/w06b.jpg','2 / 12'],['assets/catalog/w06c.jpg','3 / 12'],
    ['assets/catalog/w06d.jpg','4 / 12'],['assets/catalog/w06e.jpg','5 / 12'],['assets/catalog/w06f.jpg','6 / 12'],
    ['assets/catalog/w06g.jpg','7 / 12'],['assets/catalog/w06h.jpg','8 / 12'],['assets/catalog/w06i.jpg','9 / 12'],
    ['assets/catalog/w06j.jpg','10 / 12'],['assets/catalog/w06k.jpg','11 / 12'],['assets/catalog/w06l.jpg','12 / 12']
  ]]},
  {t:'作品 07', pages:[[
    ['assets/catalog/w07a.jpg','1 / 3'],['assets/catalog/w07b.jpg','2 / 3'],['assets/catalog/w07c.jpg','3 / 3']
  ]]},
  {t:'作品 08', pages:[[
    ['assets/catalog/w08a.jpg','1 / 2'],['assets/catalog/w08b.jpg','2 / 2']
  ]]},
  {t:'作品 09', pages:[[
    ['assets/catalog/w09a.jpg','1 / 6'],['assets/catalog/w09b.jpg','2 / 6'],['assets/catalog/w09c.jpg','3 / 6'],
    ['assets/catalog/w09d.jpg','4 / 6'],['assets/catalog/w09e.jpg','5 / 6'],['assets/catalog/w09f.jpg','6 / 6']
  ]]},
  {t:'作品 10', pages:[[
    ['assets/catalog/w10a.jpg','1 / 5'],['assets/catalog/w10b.jpg','2 / 5'],['assets/catalog/w10c.jpg','3 / 5'],
    ['assets/catalog/w10d.jpg','4 / 5'],['assets/catalog/w10e.jpg','5 / 5']
  ]]},
  /* ---------- 展板：按内容切多屏 ---------- */
  {t:'夜聚烟火 · 畅行无忧', pages:[
    [['assets/works/w11-1.jpg','开场 · 现状照片']],
    [['assets/works/w11-2.jpg','人流观察']],
    [['assets/works/w11-3.jpg','问题与策略']],
    [['assets/works/w11-4.jpg','方案与成效']]
  ]},
  {t:'Swirling Stardust', pages:[
    [['assets/works/w12-1.jpg','主视觉 · 星夜漩涡']],
    [['assets/works/w12-2.jpg','交互与代码']]
  ]},
  {t:'洄游旧光', pages:[
    [['assets/works/w13-1.jpg','方案总览']],
    [['assets/works/w13-2.jpg','场景与装置']],
    [['assets/works/w13-3.jpg','细节展示']]
  ]},
  {t:'林径护声 · 虚拟自然疗愈', pages:[
    [['assets/works/w14-1.jpg','主视觉']],
    [['assets/works/w14-2.jpg','游戏场景']],
    [['assets/works/w14-3.jpg','体验流程']],
    [['assets/works/w14-4.jpg','总结']]
  ]},
  {t:'恭城茶韵 · 插画叙事', pages:[
    [['assets/works/w15-1.jpg','开篇']],
    [['assets/works/w15-2.jpg','制茶图卷']],
    [['assets/works/w15-3.jpg','风味与传承']]
  ]},
  {t:'恭城茶韵 · 信息可视化', pages:[
    [['assets/works/w16-1.jpg','数据地图']],
    [['assets/works/w16-2.jpg','核心数据']],
    [['assets/works/w16-3.jpg','图表细节']]
  ]},
  {t:'觅径游园', pages:[
    [['assets/works/w17-1.jpg','主视觉 · 园林拼贴']],
    [['assets/works/w17-2.jpg','游园路线']],
    [['assets/works/w17-3.jpg','节点细节']]
  ]}
];

(function(){
  var q = location.search;
  var g = Math.min(WORKS.length, Math.max(1, parseInt((q.match(/[?&]g=(\d+)/) || [0, '1'])[1]) || 1)) - 1;
  var W = WORKS[g];
  var nP = W.pages.length;
  var p = Math.min(nP, Math.max(1, parseInt((q.match(/[?&]p=(\d+)/) || [0, '1'])[1]) || 1)) - 1;

  document.title = W.t + ' · 作品收藏馆';
  document.getElementById('gt').textContent = '第 ' + (g + 1) + ' 组 / 共 ' + WORKS.length + ' 组';
  document.getElementById('h1').textContent = W.t;
  document.getElementById('lnkPrev').href = 'work.html?g=' + ((g - 1 + WORKS.length) % WORKS.length + 1);
  document.getElementById('lnkNext').href = 'work.html?g=' + ((g + 1) % WORKS.length + 1);

  /* 渲染当前屏：图 + 旁白文字卡（文字内容后续替换为准确介绍） */
  var board = document.getElementById('board');
  var lead = document.getElementById('lead');
  lead.textContent = W.lead || '作品简介（待补充）：这里将放这组作品的创作背景、理念与整体形式，两三行。';
  function render(){
    board.innerHTML = '';
    W.pages[p].forEach(function(im, ri){
      var row = document.createElement('div');
      row.className = 'row' + (ri % 2 ? ' rev' : '');
      var b = document.createElement('button');
      b.className = 'ph'; b.type = 'button';
      var img = document.createElement('img');
      img.src = im[0]; img.alt = im[1]; img.draggable = false; img.loading = 'lazy';
      b.appendChild(img);
      if (im[1]){
        var c = document.createElement('div');
        c.className = 'cap'; c.textContent = im[1];
        b.appendChild(c);
      }
      b.addEventListener('click', function(){
        lbImg.src = im[0]; lb.classList.add('on');
      });
      var txt = document.createElement('div');
      txt.className = 'txt';
      var h3 = document.createElement('h3');
      h3.textContent = im[1] || (W.t + ' · 图 ' + (ri + 1));
      txt.appendChild(h3);
      (im[2] || ['创作说明（待补充）：围绕这张图写两三行，如画面内容、用到的手法与想法。', '尺寸 / 材料 / 年份（待补充）。']).forEach(function(line){
        var pp = document.createElement('p');
        pp.textContent = line;
        txt.appendChild(pp);
      });
      row.appendChild(b);
      row.appendChild(txt);
      board.appendChild(row);
    });
    if (nP > 1){
      document.getElementById('pnum').textContent = (p + 1) + ' / ' + nP;
      document.getElementById('pPrev').disabled = p === 0;
      document.getElementById('pNext').disabled = p === nP - 1;
      var ds = document.getElementById('dots'); ds.innerHTML = '';
      for (var i = 0; i < nP; i++){
        var d = document.createElement('i');
        if (i === p) d.className = 'on';
        ds.appendChild(d);
      }
    }
    window.scrollTo(0, 0);
  }
  /* 分页条（多屏才显示） */
  var pager = document.getElementById('pager');
  if (nP > 1){
    pager.style.display = 'flex';
    document.getElementById('pPrev').addEventListener('click', function(){ if (p > 0){ p--; render(); } });
    document.getElementById('pNext').addEventListener('click', function(){ if (p < nP - 1){ p++; render(); } });
  }
  render();

  /* 灯箱 */
  var lb = document.getElementById('lightbox');
  var lbImg = lb.querySelector('img');
  lb.addEventListener('click', function(){ lb.classList.remove('on'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') lb.classList.remove('on');
    if (e.key === 'ArrowLeft' && nP > 1 && p > 0){ p--; render(); }
    if (e.key === 'ArrowRight' && nP > 1 && p < nP - 1){ p++; render(); }
  });
})();
</script>

</body>
</html>
